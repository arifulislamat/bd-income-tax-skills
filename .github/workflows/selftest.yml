name: selftest

on:
  push:
    branches: [master]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run calculator self-test
        run: python3 skills/bd-income-tax/scripts/tax_calc.py --selftest
      - name: Repository checks (versions, SKILL.md, evals vs calculator)
        run: python3 tools/check_repo.py
